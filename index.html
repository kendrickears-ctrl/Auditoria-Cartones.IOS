<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auditoría de Cartones (iOS Safari)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        meli: {
                            yellow: '#FFF159',
                            blue: '#2D3277',
                            dark: '#333333',
                            gray: '#F5F5F5',
                            accent: '#3483FA'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ZXing para lectura de códigos de barras -->
    <script src="https://unpkg.com/@zxing/library@0.19.1"></script>

    <!-- jsPDF & AutoTable para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        -webkit-tap-highlight-color: transparent;
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F5F5;
            user-select: none;
        }
        .modal-active {
            overflow: hidden;
        }
        .scanner-target {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col pb-20">

    <!-- Header Principal -->
    <header class="bg-meli-yellow text-meli-dark p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="package-search" class="w-6 h-6 text-meli-blue"></i>
                <h1 class="font-bold text-lg tracking-tight">Auditoría de Cartones <span class="text-xs bg-meli-blue text-white px-2 py-0.5 rounded-full ml-1">iOS Safari</span></h1>
            </div>
            <span id="headerEmpleado" class="text-xs font-semibold bg-white/70 px-2.5 py-1 rounded-full border border-black/10">No Empleado</span>
        </div>
    </header>

    <!-- Navegación por Pestañas -->
    <nav class="bg-white border-b border-gray-200 sticky top-[57px] z-20 shadow-sm">
        <div class="max-w-md mx-auto grid grid-cols-2">
            <button id="tabCapturaBtn" onclick="switchTab('captura')" class="py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all">
                <i data-lucide="scan-line" class="w-4 h-4"></i> Captura & Auditoría
            </button>
            <button id="tabConsultaBtn" onclick="switchTab('consulta')" class="py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all">
                <i data-lucide="database" class="w-4 h-4"></i> Consultar (<span id="countBadge">0</span>)
            </button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto w-full p-4 flex-1">

        <!-- PESTAÑA 1: CAPTURA -->
        <section id="tabCaptura" class="space-y-4">

            <!-- Card 1: Datos de Sesión -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="user-check" class="w-4 h-4 text-meli-blue"></i> Datos de la Sesión
                    </h2>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Nº Empleado</label>
                        <input type="text" id="numEmpleado" placeholder="Ej: 10293" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">PSQ</label>
                        <input type="text" id="psq" placeholder="PSQ-01" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Destino</label>
                        <input type="text" id="destino" placeholder="GDL01" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Card 2: Cartón Actual -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="box" class="w-4 h-4 text-meli-blue"></i> Identificación del Cartón
                    </h2>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Código de Cartón</label>
                    <div class="flex gap-2">
                        <input type="text" id="cartonCode" placeholder="Escanea o escribe el cartón" class="flex-1 text-sm p-2.5 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none font-mono">
                        <button onclick="iniciarEscaneo('carton')" class="bg-meli-blue hover:bg-opacity-90 text-white px-3.5 py-2.5 rounded-lg flex items-center gap-1 font-semibold text-sm active:scale-95 transition-transform">
                            <i data-lucide="camera" class="w-4 h-4"></i> Escanear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 3: Escaneo de Productos & Discrepancias -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="barcode" class="w-4 h-4 text-meli-blue"></i> Lectura de Producto
                    </h2>
                </div>

                <!-- Botón Ráfaga (iOS Safari UniScan) -->
                <button onclick="iniciarEscaneo('rafaga')" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold py-3.5 px-4 rounded-xl shadow flex items-center justify-center gap-2 text-base transition-all">
                    <i data-lucide="zap" class="w-5 h-5"></i> Escanear Producto (Modo Ráfaga)
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-3 text-xs text-gray-400 uppercase font-semibold">O Ingreso Manual</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">SKU / EAN</label>
                        <input type="text" id="skuInput" placeholder="Código de producto" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Cajas Audit.</label>
                        <input type="number" id="cajasInput" min="1" value="1" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none text-center font-bold">
                    </div>
                </div>

                <div class="border-t pt-3 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-700 uppercase">¿Registrar Discrepancia?</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggleDiscrepancia" onchange="toggleSeccionDiscrepancia()" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </label>
                    </div>

                    <div id="panelDiscrepancia" class="hidden bg-amber-50 rounded-lg p-3 border border-amber-200 space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-amber-800 mb-1">Cajas Afectadas</label>
                                <input type="number" id="cajasDisc" min="0" value="0" class="w-full text-sm p-2 bg-white rounded-lg border border-amber-300 focus:outline-none font-bold text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-amber-800 mb-1">Tipo Discrepancia</label>
                                <select id="tipoDisc" class="w-full text-sm p-2 bg-white rounded-lg border border-amber-300 focus:outline-none font-semibold">
                                    <option value="Sobrante">Sobrante</option>
                                    <option value="Faltante">Faltante</option>
                                    <option value="Merma">Merma</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-amber-800 mb-1">Sobrante (pz)</label>
                                <input type="number" id="sobrantePz" min="0" value="0" class="w-full text-sm p-1.5 bg-white rounded border border-amber-300 text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-amber-800 mb-1">Faltante (pz)</label>
                                <input type="number" id="faltantePz" min="0" value="0" class="w-full text-sm p-1.5 bg-white rounded border border-amber-300 text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-amber-800 mb-1">Merma (pz)</label>
                                <input type="number" id="mermaPz" min="0" value="0" class="w-full text-sm p-1.5 bg-white rounded border border-amber-300 text-center">
                            </div>
                        </div>
                    </div>
                </div>

                <button onclick="guardarRegistro()" class="w-full bg-meli-blue hover:bg-opacity-90 active:scale-98 text-white font-bold py-3 px-4 rounded-xl shadow flex items-center justify-center gap-2 text-base transition-all">
                    <i data-lucide="save" class="w-5 h-5"></i> Guardar Registro
                </button>
            </div>
        </section>

        <!-- PESTAÑA 2: CONSULTA Y EXPORTACIÓN -->
        <section id="tabConsulta" class="space-y-4 hidden">
            <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-200 grid grid-cols-3 gap-2">
                <button onclick="exportarCSV()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> CSV (Excel)
                </button>
                <button onclick="exportarPDF()" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="file-text" class="w-4 h-4"></i> PDF (12 cols)
                </button>
                <button onclick="confirmarBorrarTodo()" class="bg-gray-100 hover:bg-red-50 text-red-600 border border-red-200 font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Borrar Todo
                </button>
            </div>

            <div id="listaRegistros" class="space-y-3"></div>
        </section>

    </main>

    <!-- MODAL DE CÁMARA -->
    <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col justify-between">
        <div class="p-4 flex justify-between items-center text-white z-10 bg-gradient-to-b from-black/80 to-transparent">
            <div>
                <h3 id="cameraModalTitle" class="font-bold text-base">Escaneando...</h3>
                <p class="text-xs text-gray-300">Apunta la cámara al código de barras</p>
            </div>
            <button onclick="cerrarCamara()" class="bg-white/20 hover:bg-white/40 text-white p-2 rounded-full backdrop-blur-md">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="relative flex-1 flex items-center justify-center overflow-hidden bg-black">
            <video id="videoPreview" autoplay playsinline webkit-playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
            <!-- Canvas oculto para procesamiento de fotogramas optimizado para iOS Safari -->
            <canvas id="canvasPreview" class="hidden"></canvas>
            <div class="relative w-64 h-40 border-2 border-emerald-400 rounded-lg z-10 flex items-center justify-center scanner-target">
                <div class="w-full h-0.5 bg-red-500 shadow-md animate-pulse"></div>
            </div>
        </div>

        <div class="p-4 text-center text-xs text-gray-300 bg-gradient-to-t from-black/80 to-transparent z-10">
            Asegúrate de tener buena iluminación en la zona de trabajo
        </div>
    </div>

    <!-- MODAL CAPTURA DE CANTIDAD -->
    <div id="cantidadModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="text-center">
                <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full uppercase">Producto Escaneado</span>
                <p id="modalSkuDetected" class="font-mono text-lg font-bold text-gray-800 mt-2 break-all">---</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1 text-center">Ingresa la cantidad de Cajas</label>
                <input type="number" id="modalCajasCount" min="1" value="1" class="w-full text-2xl font-bold text-center p-2.5 bg-gray-50 rounded-xl border-2 border-emerald-500 focus:outline-none">
            </div>

            <div class="flex gap-2">
                <button onclick="cancelarCantidadModal()" class="w-1/2 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm">
                    Cancelar
                </button>
                <button onclick="confirmarCantidadModal()" class="w-1/2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow">
                    Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let registros = [];
        let codeReader = null;
        let currentStream = null;
        let targetScanMode = null;
        let editingIndex = null;
        let isScanningActive = false;
        let scanInterval = null;
        const STORAGE_KEY = 'auditoria_cartones_ios_data_v1';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            cargarRegistros();
            document.getElementById('numEmpleado').addEventListener('input', (e) => {
                document.getElementById('headerEmpleado').textContent = e.target.value ? `Emp: ${e.target.value}` : 'No Empleado';
            });
        });

        function switchTab(tab) {
            const tabCaptura = document.getElementById('tabCaptura');
            const tabConsulta = document.getElementById('tabConsulta');
            const tabCapturaBtn = document.getElementById('tabCapturaBtn');
            const tabConsultaBtn = document.getElementById('tabConsultaBtn');

            if (tab === 'captura') {
                tabCaptura.classList.remove('hidden');
                tabConsulta.classList.add('hidden');
                tabCapturaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all';
                tabConsultaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all';
            } else {
                tabCaptura.classList.add('hidden');
                tabConsulta.classList.remove('hidden');
                tabConsultaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all';
                tabCapturaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all';
                renderizarLista();
            }
        }

        function toggleSeccionDiscrepancia() {
            const isChecked = document.getElementById('toggleDiscrepancia').checked;
            const panel = document.getElementById('panelDiscrepancia');
            if (isChecked) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
                document.getElementById('cajasDisc').value = 0;
                document.getElementById('sobrantePz').value = 0;
                document.getElementById('faltantePz').value = 0;
                document.getElementById('mermaPz').value = 0;
            }
        }

        async function iniciarEscaneo(modo) {
            if (isScanningActive) return;
            isScanningActive = true;

            targetScanMode = modo;
            document.getElementById('cameraModalTitle').textContent = modo === 'carton' ? 'Escaneando Cartón' : 'Escaneando Producto';
            document.getElementById('cameraModal').classList.remove('hidden');
            document.body.classList.add('modal-active');

            try {
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                // Solicitar cámara trasera con resolución estable para iOS
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                } catch (e) {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                }

                const videoElem = document.getElementById('videoPreview');
                const canvasElem = document.getElementById('canvasPreview');
                const canvasCtx = canvasElem.getContext('2d', { willReadFrequently: true });

                videoElem.srcObject = currentStream;
                videoElem.setAttribute('autoplay', '');
                videoElem.setAttribute('muted', '');
                videoElem.setAttribute('playsinline', '');
                videoElem.setAttribute('webkit-playsinline', '');

                const iniciarCapturaFotogramas = () => {
                    videoElem.play().then(() => {
                        // Bucle de muestreo por canvas optimizado para Safari iOS
                        scanInterval = setInterval(() => {
                            if (!isScanningActive) return;
                            if (videoElem.readyState === videoElem.HAVE_ENOUGH_DATA) {
                                canvasElem.width = videoElem.videoWidth;
                                canvasElem.height = videoElem.videoHeight;
                                if (canvasElem.width > 0 && canvasElem.height > 0) {
                                    canvasCtx.drawImage(videoElem, 0, 0, canvasElem.width, canvasElem.height);
                                    
                                    try {
                                        // Intentar decodificar directamente desde el canvas procesado
                                        const luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(canvasElem);
                                        const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                                        const result = codeReader.decode(binaryBitmap);

                                        if (result && isScanningActive) {
                                            isScanningActive = false;
                                            if (window.navigator && window.navigator.vibrate) {
                                                window.navigator.vibrate(100);
                                            }
                                            const codigo = result.getText();
                                            cerrarCamara();
                                            procesarEscaneoCodigo(codigo);
                                        }
                                    } catch (decodeErr) {
                                        // Ignorar errores por fotograma sin código detectado
                                    }
                                }
                            }
                        }, 150); // Consulta cada 150ms para un rendimiento fluido sin congelar el iPhone
                    }).catch(playErr => {
                        console.error("Error al reproducir video en iOS:", playErr);
                        isScanningActive = false;
                        cerrarCamara();
                    });
                };

                if (videoElem.readyState >= 1 || videoElem.videoWidth > 0) {
                    iniciarCapturaFotogramas();
                } else {
                    videoElem.onloadedmetadata = () => {
                        iniciarCapturaFotogramas();
                    };
                }

            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                isScanningActive = false;
                cerrarCamara();
                alert("No se pudo acceder a la cámara trasera. Asegúrate de abrir este sitio mediante un enlace seguro (HTTPS) y dar permisos en Safari.");
            }
        }

        function cerrarCamara() {
            isScanningActive = false;

            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            
            if (codeReader) {
                try { 
                    codeReader.reset(); 
                } catch (e) {}
            }

            if (currentStream) {
                try {
                    currentStream.getTracks().forEach(track => track.stop());
                } catch (e) {}
                currentStream = null;
            }

            const videoElem = document.getElementById('videoPreview');
            if (videoElem) {
                try {
                    videoElem.pause();
                } catch (e) {}
                videoElem.srcObject = null;
                videoElem.onloadedmetadata = null;
                videoElem.load();
            }

            const modal = document.getElementById('cameraModal');
            if (modal) {
                modal.classList.add('hidden');
            }
            
            document.body.classList.remove('modal-active');
        }

        function procesarEscaneoCodigo(codigo) {
            if (targetScanMode === 'carton') {
                document.getElementById('cartonCode').value = codigo;
            } else if (targetScanMode === 'rafaga') {
                document.getElementById('modalSkuDetected').textContent = codigo;
                document.getElementById('modalCajasCount').value = 1;
                document.getElementById('cantidadModal').classList.remove('hidden');
                setTimeout(() => document.getElementById('modalCajasCount').focus(), 200);
            }
        }

        function cancelarCantidadModal() {
            document.getElementById('cantidadModal').classList.add('hidden');
        }

        function confirmarCantidadModal() {
            const sku = document.getElementById('modalSkuDetected').textContent;
            const cajas = parseInt(document.getElementById('modalCajasCount').value) || 1;

            document.getElementById('skuInput').value = sku;
            document.getElementById('cajasInput').value = cajas;
            document.getElementById('cantidadModal').classList.add('hidden');
        }

        function guardarRegistro() {
            const numEmpleado = document.getElementById('numEmpleado').value.trim();
            const psq = document.getElementById('psq').value.trim();
            const destino = document.getElementById('destino').value.trim();
            const carton = document.getElementById('cartonCode').value.trim();
            const sku = document.getElementById('skuInput').value.trim();
            const cajasAuditadas = parseInt(document.getElementById('cajasInput').value) || 0;

            if (!numEmpleado || !carton || !sku) {
                alert("Por favor completa los datos obligatorios: Nº Empleado, Código de Cartón y SKU.");
                return;
            }

            const tieneDiscrepancia = document.getElementById('toggleDiscrepancia').checked;
            const cajasDisc = tieneDiscrepancia ? (parseInt(document.getElementById('cajasDisc').value) || 0) : 0;
            const tipoDisc = tieneDiscrepancia ? document.getElementById('tipoDisc').value : 'N/A';
            const sobrante = tieneDiscrepancia ? (parseInt(document.getElementById('sobrantePz').value) || 0) : 0;
            const faltante = tieneDiscrepancia ? (parseInt(document.getElementById('faltantePz').value) || 0) : 0;
            const merma = tieneDiscrepancia ? (parseInt(document.getElementById('mermaPz').value) || 0) : 0;

            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-MX');
            const horaStr = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const nuevoRegistro = {
                destino: destino || 'GDL',
                psq: psq || 'N/A',
                carton: carton,
                numEmpleado: numEmpleado,
                hora: horaStr,
                fecha: fechaStr,
                sku: sku,
                cajasAuditadas: cajasAuditadas,
                cajasConDiscrepancia: cajasDisc,
                sobrante: sobrante,
                faltante: faltante,
                merma: merma,
                tipoDiscrepancia: tipoDisc
            };

            if (editingIndex !== null) {
                registros[editingIndex] = nuevoRegistro;
                editingIndex = null;
                alert("Registro actualizado correctamente.");
            } else {
                registros.unshift(nuevoRegistro);
            }

            guardarEnLocalStorage();
            limpiarFormularioDetalle();
            actualizarBadge();
        }

        function limpiarFormularioDetalle() {
            document.getElementById('skuInput').value = '';
            document.getElementById('cajasInput').value = '1';
            document.getElementById('toggleDiscrepancia').checked = false;
            toggleSeccionDiscrepancia();
        }

        function cargarRegistros() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) registros = JSON.parse(data);
            } catch (e) { registros = []; }
            actualizarBadge();
        }

        function guardarEnLocalStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(registros)); } catch (e) {}
        }

        function actualizarBadge() {
            document.getElementById('countBadge').textContent = registros.length;
        }

        function renderizarLista() {
            const container = document.getElementById('listaRegistros');
            if (registros.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center text-gray-400 border border-gray-200">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p class="font-medium text-sm">No hay registros guardados en este turno.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = registros.map((reg, idx) => `
                <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-200 space-y-2">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-2">
                        <div>
                            <span class="text-xs font-bold text-meli-blue bg-blue-50 px-2 py-0.5 rounded">Destino: ${reg.destino}</span>
                            <span class="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-0.5 rounded ml-1">PSQ: ${reg.psq}</span>
                            <h4 class="font-mono font-bold text-sm text-gray-800 mt-1">Cartón: ${reg.carton}</h4>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-gray-400 font-semibold">${reg.fecha} ${reg.hora}</span>
                            <div class="flex justify-end gap-1 mt-1">
                                <button onclick="editarRegistro(${idx})" class="p-1 text-blue-600 hover:bg-blue-50 rounded"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="eliminarRegistro(${idx})" class="p-1 text-red-600 hover:bg-red-50 rounded"><i data-lucide="trash" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 text-xs">
                        <div><span class="text-gray-400">SKU:</span> <span class="font-mono font-semibold">${reg.sku}</span></div>
                        <div><span class="text-gray-400">Cajas Audit.:</span> <span class="font-bold text-gray-700">${reg.cajasAuditadas}</span></div>
                        <div><span class="text-gray-400">Emp:</span> <span class="font-semibold">${reg.numEmpleado}</span></div>
                        <div><span class="text-gray-400">Cajas Disc:</span> <span class="font-semibold text-amber-600">${reg.cajasConDiscrepancia}</span></div>
                    </div>
                    ${(reg.sobrante > 0 || reg.faltante > 0 || reg.merma > 0) ? `
                        <div class="bg-amber-50 p-1.5 rounded text-[11px] flex justify-between text-amber-900 border border-amber-200 font-semibold">
                            <span>Sob: ${reg.sobrante}</span>
                            <span>Falt: ${reg.faltante}</span>
                            <span>Mer: ${reg.merma}</span>
                        </div>
                    ` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        function eliminarRegistro(idx) {
            if (confirm("¿Seguro que deseas eliminar este registro?")) {
                registros.splice(idx, 1);
                guardarEnLocalStorage();
                renderizarLista();
                actualizarBadge();
            }
        }

        function editarRegistro(idx) {
            const reg = registros[idx];
            editingIndex = idx;
            document.getElementById('numEmpleado').value = reg.numEmpleado;
            document.getElementById('psq').value = reg.psq;
            document.getElementById('destino').value = reg.destino;
            document.getElementById('cartonCode').value = reg.carton;
            document.getElementById('skuInput').value = reg.sku;
            document.getElementById('cajasInput').value = reg.cajasAuditadas;

            if (reg.cajasConDiscrepancia > 0 || reg.sobrante > 0 || reg.faltante > 0 || reg.merma > 0) {
                document.getElementById('toggleDiscrepancia').checked = true;
                toggleSeccionDiscrepancia();
                document.getElementById('cajasDisc').value = reg.cajasConDiscrepancia;
                document.getElementById('tipoDisc').value = reg.tipoDiscrepancia || 'Sobrante';
                document.getElementById('sobrantePz').value = reg.sobrante;
                document.getElementById('faltantePz').value = reg.faltante;
                document.getElementById('mermaPz').value = reg.merma;
            } else {
                document.getElementById('toggleDiscrepancia').checked = false;
                toggleSeccionDiscrepancia();
            }
            switchTab('captura');
        }

        function confirmarBorrarTodo() {
            if (registros.length === 0) {
                alert("No hay registros para borrar.");
                return;
            }
            if (confirm("ATENCIÓN: ¿Estás seguro de que deseas eliminar TODOS los registros del turno?")) {
                registros = [];
                guardarEnLocalStorage();
                renderizarLista();
                actualizarBadge();
            }
        }

        function exportarCSV() {
            if (registros.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            const headers = ["Destino", "PSQ", "Carton", "Numero de Empleado", "Hora", "Fecha", "SKU", "Cajas Auditadas", "Cajas con Discrepancia", "Sobrante", "Faltante", "Merma"];
            const rows = registros.map(r => [
                `"${r.destino}"`, `"${r.psq}"`, `"${r.carton}"`, `"${r.numEmpleado}"`, `"${r.hora}"`, `"${r.fecha}"`, `"${r.sku}"`,
                r.cajasAuditadas, r.cajasConDiscrepancia, r.sobrante, r.faltante, r.merma
            ]);
            let csvContent = "\uFEFF" + headers.join(";") + "\n";
            rows.forEach(rowArray => { csvContent += rowArray.join(";") + "\n"; });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Auditoria_Cartones_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportarPDF() {
            if (registros.length === 0) {
                alert("No hay datos para exportar a PDF.");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', format: 'a4' });
            doc.setFontSize(14);
            doc.text("Reporte de Auditoría de Cartones", 14, 15);
            doc.setFontSize(9);
            doc.text(`Generado el: ${new Date().toLocaleString('es-MX')}`, 14, 21);

            const tableHeaders = [["Destino", "PSQ", "Cartón", "Empleado", "Hora", "Fecha", "SKU", "Caj. Aud", "Caj. Disc", "Sob", "Falt", "Mer"]];
            const tableData = registros.map(r => [r.destino, r.psq, r.carton, r.numEmpleado, r.hora, r.fecha, r.sku, r.cajasAuditadas, r.cajasConDiscrepancia, r.sobrante, r.faltante, r.merma]);

            doc.autoTable({
                head: tableHeaders,
                body: tableData,
                startY: 25,
                theme: 'grid',
                styles: { fontSize: 7, cellPadding: 2 },
                headStyles: { fillColor: [45, 50, 119], textColor: [255, 255, 255], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [245, 245, 245] }
            });
            doc.save(`Auditoria_Cartones_${new Date().toISOString().slice(0,10)}.pdf`);
        }
    </script>
</body>
</html>
