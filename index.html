<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auditoría de Cartones (Android)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        meli: {
                            yellow: '#FFF159',
                            blue: '#2D3277',
                            dark: '#333333',
                            gray: '#F5F5F5',
                            accent: '#3483FA'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ZXing para lectura de códigos de barras (Versión estable y robusta) -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>

    <!-- jsPDF & AutoTable para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        -webkit-tap-highlight-color: transparent;
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F5F5;
            user-select: none;
        }
        .modal-active {
            overflow: hidden;
        }
        .scanner-target {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col pb-20">

    <!-- Header Principal -->
    <header class="bg-meli-yellow text-meli-dark p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="package-search" class="w-6 h-6 text-meli-blue"></i>
                <h1 class="font-bold text-lg tracking-tight">Auditoría de Cartones <span class="text-xs bg-meli-blue text-white px-2 py-0.5 rounded-full ml-1">Android</span></h1>
            </div>
            <span id="headerAuditor" class="text-xs font-semibold bg-white/70 px-2.5 py-1 rounded-full border border-black/10">Auditor: N/D</span>
        </div>
    </header>

    <!-- Navegación por Pestañas -->
    <nav class="bg-white border-b border-gray-200 sticky top-[57px] z-20 shadow-sm">
        <div class="max-w-md mx-auto grid grid-cols-2">
            <button id="tabCapturaBtn" onclick="switchTab('captura')" class="py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all">
                <i data-lucide="scan-line" class="w-4 h-4"></i> Captura & Auditoría
            </button>
            <button id="tabConsultaBtn" onclick="switchTab('consulta')" class="py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all">
                <i data-lucide="database" class="w-4 h-4"></i> Consultar (<span id="countBadge">0</span>)
            </button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto w-full p-4 flex-1">

        <!-- PESTAÑA 1: CAPTURA -->
        <section id="tabCaptura" class="space-y-4">

            <!-- Card 1: Campos de Captura (Orden solicitado) -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="box" class="w-4 h-4 text-meli-blue"></i> Datos de Auditoría
                    </h2>
                </div>

                <!-- Primera fila: Auditor y Turno -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Auditor</label>
                        <input type="text" id="auditor" placeholder="Nombre o ID" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Turno</label>
                        <input type="text" id="turno" placeholder="Ej: Turno 1" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                </div>

                <!-- Segunda fila: Supervisor -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Supervisor</label>
                    <input type="text" id="supervisor" placeholder="Nombre del supervisor responsable" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                </div>

                <!-- Tercera fila: Destino y PSQ -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Destino</label>
                        <input type="text" id="destino" placeholder="Ej: 3782" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Pick Sequence (PSQ)</label>
                        <input type="text" id="psq" placeholder="Ej: PSQ045" class="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none">
                    </div>
                </div>

                <!-- Cuarta fila: Cartón con botón de escaneo -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Cartón</label>
                    <div class="flex gap-2">
                        <input type="text" id="cartonCode" placeholder="Escanea o escribe el cartón" class="flex-1 text-sm p-2.5 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none font-mono">
                        <button onclick="iniciarEscaneoCarton()" class="bg-meli-blue hover:bg-opacity-90 text-white px-3.5 py-2.5 rounded-lg flex items-center gap-1 font-semibold text-sm active:scale-95 transition-transform">
                            <i data-lucide="camera" class="w-4 h-4"></i> Escanear
                        </button>
                    </div>
                </div>

                <!-- Quinta fila: Cajas auditadas (vacío por defecto) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Cajas auditadas</label>
                    <input type="number" id="cajasAuditadas" placeholder="Ingrese cantidad" min="0" class="w-full text-sm p-2.5 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-meli-accent focus:outline-none font-bold text-center">
                </div>
            </div>

            <!-- Card 2: Apartado de Discrepancias Múltiples -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i> Discrepancias
                    </h2>
                    <button onclick="agregarDiscrepanciaItem()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm flex items-center gap-1 transition-all active:scale-95">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> Agregar otra discrepancia
                    </button>
                </div>

                <div id="discrepanciasContainer" class="space-y-3 pt-1">
                    <!-- Dinámico -->
                </div>
            </div>

            <button onclick="guardarRegistro()" class="w-full bg-meli-blue hover:bg-opacity-90 active:scale-98 text-white font-bold py-3.5 px-4 rounded-xl shadow flex items-center justify-center gap-2 text-base transition-all">
                <i data-lucide="save" class="w-5 h-5"></i> Guardar Registro
            </button>
        </section>

        <!-- PESTAÑA 2: CONSULTA Y EXPORTACIÓN -->
        <section id="tabConsulta" class="space-y-4 hidden">
            <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-200 grid grid-cols-3 gap-2">
                <button onclick="exportarCSV()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> CSV (Excel)
                </button>
                <button onclick="exportarPDF()" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="file-text" class="w-4 h-4"></i> PDF Reporte
                </button>
                <button onclick="confirmarBorrarTodo()" class="bg-gray-100 hover:bg-red-50 text-red-600 border border-red-200 font-semibold py-2.5 px-2 rounded-lg text-xs flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Borrar Todo
                </button>
            </div>

            <div id="listaRegistros" class="space-y-3"></div>
        </section>

    </main>

    <!-- MODAL DE CÁMARA PARA ANDROID -->
    <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col justify-between">
        <div class="p-4 flex justify-between items-center text-white z-10 bg-gradient-to-b from-black/80 to-transparent">
            <div>
                <h3 class="font-bold text-base">Escaneando Cartón (Android)</h3>
                <p class="text-xs text-gray-300">Apunta al código de barras del LPN</p>
            </div>
            <button onclick="cerrarCamara()" class="bg-white/20 hover:bg-white/40 text-white p-2 rounded-full backdrop-blur-md">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="relative flex-1 flex items-center justify-center overflow-hidden bg-black">
            <video id="videoPreview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
            <div class="relative w-64 h-40 border-2 border-emerald-400 rounded-lg z-10 flex items-center justify-center scanner-target">
                <div class="w-full h-0.5 bg-red-500 shadow-md animate-pulse"></div>
            </div>
        </div>

        <div class="p-4 text-center text-xs text-gray-300 bg-gradient-to-t from-black/80 to-transparent z-10">
            Mantén estable el dispositivo frente al código
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        let registros = [];
        let codeReader = null;
        let currentStream = null;
        let isScanningActive = false;
        const STORAGE_KEY = 'auditoria_cartones_android_v5';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            cargarRegistros();
            agregarDiscrepanciaItem();
            
            document.getElementById('auditor').addEventListener('input', (e) => {
                document.getElementById('headerAuditor').textContent = e.target.value ? `Auditor: ${e.target.value}` : 'Auditor: N/D';
            });
        });

        function switchTab(tab) {
            const tabCaptura = document.getElementById('tabCaptura');
            const tabConsulta = document.getElementById('tabConsulta');
            const tabCapturaBtn = document.getElementById('tabCapturaBtn');
            const tabConsultaBtn = document.getElementById('tabConsultaBtn');

            if (tab === 'captura') {
                tabCaptura.classList.remove('hidden');
                tabConsulta.classList.add('hidden');
                tabCapturaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all';
                tabConsultaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all';
            } else {
                tabCaptura.classList.add('hidden');
                tabConsulta.classList.remove('hidden');
                tabConsultaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-meli-blue text-meli-blue flex justify-center items-center gap-2 transition-all';
                tabCapturaBtn.className = 'py-3 font-semibold text-center text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex justify-center items-center gap-2 transition-all';
                renderizarLista();
            }
        }

        // --- GESTIÓN DE DISCREPANCIAS MÚLTIPLES ---
        function agregarDiscrepanciaItem(sku = '', cajas = 0, piezas = 0, tipo = 'Faltante') {
            const container = document.getElementById('discrepanciasContainer');
            const index = container.children.length;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'bg-amber-50 rounded-xl p-3 border border-amber-200 space-y-2 relative disc-item';
            itemDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-amber-900 uppercase">Discrepancia #${index + 1}</span>
                    ${index > 0 ? `<button type="button" onclick="this.closest('.disc-item').remove()" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">SKU</label>
                    <input type="text" class="disc-sku w-full text-sm p-2 bg-white rounded-lg border border-amber-300 focus:outline-none font-mono" placeholder="Código SKU" value="${sku}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 mb-1">Cajas</label>
                        <input type="number" min="0" class="disc-cajas w-full text-sm p-2 bg-white rounded-lg border border-amber-300 text-center font-bold" value="${cajas}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 mb-1">Piezas</label>
                        <input type="number" min="0" class="disc-piezas w-full text-sm p-2 bg-white rounded-lg border border-amber-300 text-center font-bold" value="${piezas}">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">Tipo de discrepancia</label>
                    <select class="disc-tipo w-full text-sm p-2 bg-white rounded-lg border border-amber-300 font-semibold">
                        <option value="Faltante" ${tipo === 'Faltante' ? 'selected' : ''}>Faltante</option>
                        <option value="Sobrante" ${tipo === 'Sobrante' ? 'selected' : ''}>Sobrante</option>
                        <option value="Merma" ${tipo === 'Merma' ? 'selected' : ''}>Merma</option>
                    </select>
                </div>
            `;
            container.appendChild(itemDiv);
            lucide.createIcons();
        }

        // --- ESCÁNER DE CÁMARA (Restaurado y optimizado) ---
        async function iniciarEscaneoCarton() {
            if (isScanningActive) return;
            isScanningActive = true;

            document.getElementById('cameraModal').classList.remove('hidden');
            document.body.classList.add('modal-active');

            try {
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                } catch (e) {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                }

                const videoElem = document.getElementById('videoPreview');
                videoElem.srcObject = currentStream;

                codeReader.decodeFromVideoElementContinuously(videoElem, (result, err) => {
                    if (result && isScanningActive) {
                        isScanningActive = false;
                        if (window.navigator && window.navigator.vibrate) {
                            window.navigator.vibrate(100);
                        }
                        document.getElementById('cartonCode').value = result.getText();
                        cerrarCamara();
                    }
                });
            } catch (err) {
                console.error("Error al iniciar cámara:", err);
                isScanningActive = false;
                cerrarCamara();
                alert("No se pudo acceder a la cámara. Verifica los permisos del navegador.");
            }
        }

        function cerrarCamara() {
            isScanningActive = false;
            if (codeReader) {
                try { codeReader.reset(); } catch (e) {}
            }
            if (currentStream) {
                try { currentStream.getTracks().forEach(track => track.stop()); } catch (e) {}
                currentStream = null;
            }
            const videoElem = document.getElementById('videoPreview');
            if (videoElem) videoElem.srcObject = null;

            document.getElementById('cameraModal').classList.add('hidden');
            document.body.classList.remove('modal-active');
        }

        // --- GUARDADO Y LIMPIEZA ---
        function guardarRegistro() {
            const auditor = document.getElementById('auditor').value.trim();
            const turno = document.getElementById('turno').value.trim();
            const supervisor = document.getElementById('supervisor').value.trim();
            const destino = document.getElementById('destino').value.trim();
            const psq = document.getElementById('psq').value.trim();
            const carton = document.getElementById('cartonCode').value.trim();
            const cajasAuditadasVal = document.getElementById('cajasAuditadas').value.trim();

            if (!auditor || !carton) {
                alert("Por favor completa al menos los campos obligatorios: Auditor y Cartón.");
                return;
            }

            if (cajasAuditadasVal === "") {
                alert("Por favor ingresa la cantidad de cajas auditadas.");
                return;
            }

            const cajasAuditadas = parseInt(cajasAuditadasVal) || 0;

            const discItems = document.querySelectorAll('.disc-item');
            const discrepanciasList = [];

            discItems.forEach(item => {
                const sku = item.querySelector('.disc-sku').value.trim() || 'N/A';
                const cajas = parseInt(item.querySelector('.disc-cajas').value) || 0;
                const piezas = parseInt(item.querySelector('.disc-piezas').value) || 0;
                const tipo = item.querySelector('.disc-tipo').value;

                discrepanciasList.push({ sku, cajas, piezas, tipo });
            });

            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-MX');
            const horaStr = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const nuevoRegistro = {
                auditor,
                turno: turno || 'N/A',
                supervisor: supervisor || 'N/A',
                destino: destino || 'N/A',
                psq: psq || 'N/A',
                carton,
                cajasAuditadas,
                fecha: fechaStr,
                hora: horaStr,
                discrepancias: discrepanciasList
            };

            registros.unshift(nuevoRegistro);
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
            } catch (e) {
                alert("Error al guardar en almacenamiento local.");
                return;
            }

            // Limpieza completa de campos y formulario post-guardado exitoso
            document.getElementById('auditor').value = '';
            document.getElementById('turno').value = '';
            document.getElementById('supervisor').value = '';
            document.getElementById('destino').value = '';
            document.getElementById('psq').value = '';
            document.getElementById('cartonCode').value = '';
            document.getElementById('cajasAuditadas').value = '';
            document.getElementById('headerAuditor').textContent = 'Auditor: N/D';

            const container = document.getElementById('discrepanciasContainer');
            container.innerHTML = '';
            agregarDiscrepanciaItem();

            actualizarBadge();
            alert("¡Registro guardado correctamente!");
        }

        function cargarRegistros() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) registros = JSON.parse(data);
            } catch (e) { registros = []; }
            actualizarBadge();
        }

        function actualizarBadge() {
            document.getElementById('countBadge').textContent = registros.length;
        }

        function renderizarLista() {
            const container = document.getElementById('listaRegistros');
            if (registros.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center text-gray-400 border border-gray-200">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p class="font-medium text-sm">No hay registros guardados.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = registros.map((reg, idx) => `
                <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-200 space-y-2">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-2">
                        <div>
                            <span class="text-xs font-bold text-meli-blue bg-blue-50 px-2 py-0.5 rounded">LPN: ${reg.carton}</span>
                            <span class="text-xs text-gray-500 ml-1">Dest: ${reg.destino} | PSQ: ${reg.psq}</span>
                        </div>
                        <button onclick="eliminarRegistro(${idx})" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="grid grid-cols-2 text-xs gap-1">
                        <div><span class="text-gray-400">Auditor:</span> <span class="font-semibold">${reg.auditor}</span></div>
                        <div><span class="text-gray-400">Turno:</span> <span class="font-semibold">${reg.turno}</span></div>
                        <div><span class="text-gray-400">Supervisor:</span> <span class="font-semibold">${reg.supervisor}</span></div>
                        <div><span class="text-gray-400">Cajas Audit.:</span> <span class="font-bold">${reg.cajasAuditadas}</span></div>
                        <div class="col-span-2"><span class="text-gray-400">Fecha/Hora:</span> <span class="text-gray-600">${reg.fecha} ${reg.hora}</span></div>
                    </div>
                    <div class="space-y-1.5 pt-1">
                        <div class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Discrepancias (${reg.discrepancias.length}):</div>
                        ${reg.discrepancias.map(d => `
                            <div class="bg-amber-50 p-2 rounded-lg text-xs border border-amber-200 flex justify-between items-center">
                                <div>
                                    <span class="font-mono font-bold text-amber-900">${d.sku}</span>
                                    <span class="text-amber-800 ml-1">(${d.tipo})</span>
                                </div>
                                <div class="text-right text-amber-900 font-semibold">
                                    <span>Caj: ${d.cajas}</span> | <span>Pz: ${d.piezas}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function eliminarRegistro(idx) {
            if (confirm("¿Deseas eliminar este registro completo?")) {
                registros.splice(idx, 1);
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(registros)); } catch (e) {}
                renderizarLista();
                actualizarBadge();
            }
        }

        function confirmarBorrarTodo() {
            if (registros.length === 0) return;
            if (confirm("¿Estás seguro de borrar todos los registros?")) {
                registros = [];
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(registros)); } catch (e) {}
                renderizarLista();
                actualizarBadge();
            }
        }

        // --- EXPORTACIÓN CSV ---
        function exportarCSV() {
            if (registros.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            const headers = ["LPN", "Destino", "PSQ", "Cajas Auditadas", "SKU Discrepancia", "Cajas Discrepancia", "Piezas Discrepancia", "Tipo Discrepancia", "Auditor", "Hora", "Fecha"];
            const rows = [];

            registros.forEach(r => {
                r.discrepancias.forEach(d => {
                    rows.push([
                        `"${r.carton}"`, `"${r.destino}"`, `"${r.psq}"`, r.cajasAuditadas,
                        `"${d.sku}"`, d.cajas, d.piezas, `"${d.tipo}"`,
                        `"${r.auditor}"`, `"${r.hora}"`, `"${r.fecha}"`
                    ]);
                });
            });

            let csvContent = "\uFEFF" + headers.join(";") + "\n";
            rows.forEach(row => { csvContent += row.join(";") + "\n"; });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Auditoria_Cartones_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- EXPORTACIÓN PDF ---
        function exportarPDF() {
            if (registros.length === 0) {
                alert("No hay datos para exportar a PDF.");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', format: 'a4' });

            const auditorInforme = registros.length > 0 ? registros[0].auditor : 'N/D';
            const fechaInforme = new Date().toLocaleDateString('es-MX');

            doc.setFontSize(14);
            doc.text("Reporte de Auditoría de Cartones", 14, 15);
            doc.setFontSize(10);
            doc.text(`Auditor: ${auditorInforme}`, 14, 22);
            doc.text(`Fecha del informe: ${fechaInforme}`, 100, 22);

            const tableHeaders = [["LPN / Cartón", "Destino", "PSQ", "Cajas auditadas", "SKU", "Cajas", "Piezas", "Tipo", "Hora"]];
            const tableData = [];

            registros.forEach(r => {
                r.discrepancias.forEach(d => {
                    tableData.push([r.carton, r.destino, r.psq, r.cajasAuditadas, d.sku, d.cajas, d.piezas, d.tipo, r.hora]);
                });
            });

            doc.autoTable({
                head: tableHeaders,
                body: tableData,
                startY: 27,
                theme: 'grid',
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [45, 50, 119], textColor: [255, 255, 255], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [245, 245, 245] }
            });

            doc.save(`Auditoria_Cartones_${new Date().toISOString().slice(0,10)}.pdf`);
        }
    </script>
</body>
</html>
